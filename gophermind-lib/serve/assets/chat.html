<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<!-- Everything the model says is put on the page with textContent, never as
     markup; the policy below is a second layer should that ever slip. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'self'">
<title>GopherMind chat</title>
<style>
/*GM_CSS*/
</style>
</head>
<body class="gm-chat">
<div class="shell">
<!--GM_RAIL-->
<main class="main">
<div class="chat">
<aside class="sessions">
  <header><button id="newBtn" type="button">New chat</button></header>
  <div id="sessions"></div>
</aside>
<section class="conv">
  <div id="log"></div>
  <div id="status"></div>
  <div id="autoBar" class="autobar" hidden>
    <span>Auto approve is ON for this chat. Brief actions still ask.</span>
    <button id="autoOff" type="button">Turn off</button>
  </div>
  <form id="form">
    <label class="autotoggle"><input type="checkbox" id="autoApprove" autocomplete="off"> Auto approve</label>
    <textarea id="input" rows="2" placeholder="Message GopherMind (Enter sends, Shift+Enter for a new line)"></textarea>
    <button id="sendBtn" type="submit">Send</button>
  </form>
</section>
</div>
</main>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const logEl = $('log'), listEl = $('sessions'), statusEl = $('status');
const inputEl = $('input'), sendBtn = $('sendBtn'), formEl = $('form');
let sessionId = '';
let busy = false;

/*GM_AUTO_BEGIN*/
// Brief actions always ask, even with Auto approve on. Names are compared
// case-insensitively and exactly (fail closed).
const BRIEF_ACTIONS = ['brief_create', 'brief_answer', 'brief_stop', 'brief_resubmit'];
function shouldAutoApprove(autoOn, tool, truncated){
  if(autoOn !== true || truncated) return false;
  if(typeof tool !== 'string' || tool === '') return false;
  return BRIEF_ACTIONS.indexOf(tool.toLowerCase()) < 0;
}
/*GM_AUTO_END*/

// Auto approve lives only in this variable: it is off on every page load and
// whenever the current chat changes.
let autoOn = false;
function setAuto(on){
  autoOn = on === true;
  $('autoApprove').checked = autoOn;
  $('autoBar').hidden = !autoOn;
}

// el builds an element; text only ever goes in through textContent.
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = String(text);
  return e;
}

// api calls the server with the session cookie; the server adds the bearer.
function api(path, opts){
  return fetch(path, Object.assign({ credentials: 'same-origin' }, opts || {}));
}

function addMsg(cls, text){
  const e = el('div', 'msg ' + cls, text);
  logEl.appendChild(e);
  logEl.scrollTop = logEl.scrollHeight;
  return e;
}

function addTool(text){
  const e = el('div', 'tool', text);
  logEl.appendChild(e);
  logEl.scrollTop = logEl.scrollHeight;
  return e;
}

function clip(s, n){
  s = String(s == null ? '' : s);
  return s.length > n ? s.slice(0, n) + '...' : s;
}

function setStatus(t){ statusEl.textContent = t || ''; }

async function loadSessions(){
  try{
    const r = await api('/session');
    if(!r.ok) throw new Error(String(r.status));
    const infos = await r.json();
    listEl.replaceChildren();
    infos.forEach(s => {
      const row = el('div', 'sess' + (s.ID === sessionId ? ' on' : ''), s.Name || s.Title || s.ID);
      row.title = s.ID;
      row.addEventListener('click', () => openSession(s.ID));
      listEl.appendChild(row);
    });
  } catch(err){
    setStatus('could not list sessions: ' + err.message);
  }
}

// renderHistory draws saved messages (llm.Message JSON) compactly.
function renderHistory(msgs){
  logEl.replaceChildren();
  (msgs || []).forEach(m => {
    if(m.role === 'user' || m.role === 'assistant'){
      if(m.content) addMsg(m.role, m.content);
      (m.tool_calls || []).forEach(tc => {
        const f = tc.function || {};
        addTool('tool ' + f.name + ' ' + clip(f.arguments, 200));
      });
    } else if(m.role === 'tool'){
      addTool('result ' + (m.name || '') + ' ' + clip(m.content, 300));
    }
  });
}

async function openSession(id){
  if(busy) return;
  sessionId = id;
  setAuto(false);
  logEl.replaceChildren();
  setStatus('');
  try{
    const r = await api('/session/' + encodeURIComponent(id) + '/messages');
    if(r.ok) renderHistory(await r.json());
  } catch(err){
    setStatus('could not load history: ' + err.message);
  }
  loadSessions();
}

async function newSession(){
  const r = await api('/session', { method: 'POST' });
  if(!r.ok) throw new Error('create session: ' + r.status);
  return (await r.json()).id;
}

// approve answers an approval-needed event. POST /session/{id}/approve.
async function approve(box, id, ok){
  box.querySelectorAll('button').forEach(b => { b.disabled = true; });
  try{
    const r = await api('/session/' + encodeURIComponent(sessionId) + '/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ approval_id: id, approved: ok })
    });
    box.appendChild(el('div', null, r.ok ? (ok ? 'approved' : 'denied') : 'approval failed: ' + r.status));
    return r.ok ? 'ok' : 'failed';
  } catch(err){
    box.appendChild(el('div', 'err', 'approval failed: ' + err.message));
    return 'network';
  }
}

// compactJSON removes insignificant whitespace (outside strings) from s.
function compactJSON(s){
  let out = '', inStr = false, esc = false;
  for(const ch of s){
    if(inStr){
      out += ch;
      if(esc) esc = false; else if(ch === '\\') esc = true; else if(ch === '"') inStr = false;
    } else if(ch === '"'){ inStr = true; out += ch; }
    else if(ch !== ' ' && ch !== '\n' && ch !== '\r' && ch !== '\t') out += ch;
  }
  return out;
}

// approvalArgs renders a tool call's raw JSON args for the approval card. The
// pretty-printed form is used only when it is a faithful rendering (the parsed
// value re-serializes to the same compact text); otherwise the raw string is
// shown. Text is cut at 200000 characters, and then truncated is true with
// the real length in total: the card must say so and block Approve.
function approvalArgs(raw){
  let s = String(raw == null ? '' : raw);
  const total = s.length;
  try {
    const v = JSON.parse(s);
    if(JSON.stringify(v) === compactJSON(s)) s = JSON.stringify(v, null, 2);
  } catch (e) {}
  const truncated = s.length > 200000 || total > 200000;
  return { text: truncated ? s.slice(0, 200000) : s, truncated: truncated, total: total };
}

function addApproval(ev, note){
  const box = el('div', 'approval');
  box.appendChild(el('div', null, 'Approval needed to run ' + ev.tool));
  if(note) box.appendChild(el('div', 'err', note));
  const shown = approvalArgs(ev.args);
  if(shown.truncated){
    box.appendChild(el('div', null, 'TRUNCATED: showing the first 200000 of ' + shown.total + ' characters. Approve is disabled because the full arguments cannot be reviewed.'));
  }
  box.appendChild(el('pre', null, shown.text));
  const yes = el('button', null, 'Approve'), no = el('button', null, 'Deny');
  yes.type = 'button'; no.type = 'button';
  if(shown.truncated) yes.disabled = true;
  yes.addEventListener('click', () => approve(box, ev.approval_id, true));
  no.addEventListener('click', () => approve(box, ev.approval_id, false));
  box.appendChild(yes);
  box.appendChild(no);
  logEl.appendChild(box);
  logEl.scrollTop = logEl.scrollHeight;
}

// autoApprove answers an approval-needed event with approve true and leaves a
// compact log entry that still shows the full arguments. If the POST fails the
// normal card is shown so the call can be approved or denied by hand.
async function autoApprove(ev){
  const box = el('details', 'approval auto');
  const sum = el('summary', null, 'Auto approving: ' + ev.tool);
  box.appendChild(sum);
  box.appendChild(el('pre', null, approvalArgs(ev.args).text));
  logEl.appendChild(box);
  logEl.scrollTop = logEl.scrollHeight;
  const res = await approve(box, ev.approval_id, true);
  if(res === 'ok'){
    sum.textContent = 'Auto approved: ' + ev.tool;
    return;
  }
  sum.textContent = 'Auto approve failed: ' + ev.tool;
  addApproval(ev, res === 'network'
    ? 'The auto approval request failed in transit. It may already have been applied, so Deny might not stop the call.'
    : null);
}

function parseJSON(s){
  try{ return JSON.parse(s); } catch(e){ return null; }
}

// handle applies one SSE event. cur holds the open assistant bubble.
function handle(cur, event, data){
  switch(event){
  case 'token':
    if(!cur.el) cur.el = addMsg('assistant', '');
    cur.el.textContent += data;
    logEl.scrollTop = logEl.scrollHeight;
    break;
  case 'assistant':
    // The complete message supersedes any streamed tokens for it.
    if(!cur.el) cur.el = addMsg('assistant', '');
    cur.el.textContent = data;
    cur.el = null;
    break;
  case 'tool_call': {
    cur.el = null;
    const t = parseJSON(data) || {};
    addTool('tool ' + (t.name || '?') + ' ' + clip(t.args, 200));
    break;
  }
  case 'tool_result': {
    const t = parseJSON(data) || {};
    addTool('result ' + (t.name || '') + ' ' + clip(t.text, 300));
    break;
  }
  case 'approval-needed': {
    const a = parseJSON(data);
    if(a && a.approval_id){
      if(shouldAutoApprove(autoOn, a.tool, approvalArgs(a.args).truncated)) autoApprove(a);
      else addApproval(a);
    }
    break;
  }
  case 'usage': {
    const u = parseJSON(data);
    if(u) setStatus(clip(JSON.stringify(u), 160));
    break;
  }
  case 'error':
    cur.el = null;
    addMsg('err', data);
    break;
  default:
    break;
  }
}

// readSSE reads an event stream from fetch, calling onEvent(event, data).
async function readSSE(resp, onEvent){
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '', event = '', data = [];
  const flush = () => {
    if(event || data.length) onEvent(event || 'message', data.join('\n'));
    event = ''; data = [];
  };
  for(;;){
    const { value, done } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while((nl = buf.indexOf('\n')) >= 0){
      let line = buf.slice(0, nl);
      buf = buf.slice(nl + 1);
      if(line.endsWith('\r')) line = line.slice(0, -1);
      if(line === ''){ flush(); continue; }
      if(line.startsWith('event:')) event = line.slice(6).trim();
      else if(line.startsWith('data:')){
        const v = line.slice(5);
        data.push(v.startsWith(' ') ? v.slice(1) : v);
      }
    }
  }
  flush();
}

async function send(text){
  busy = true;
  sendBtn.disabled = true;
  setStatus('working...');
  try{
    if(!sessionId) sessionId = await newSession();
    addMsg('user', text);
    const resp = await api('/session/' + encodeURIComponent(sessionId) + '/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: text
    });
    if(!resp.ok){
      addMsg('err', resp.status === 409 ? 'This session is busy with another turn.' : 'request failed: ' + resp.status);
      return;
    }
    const cur = { el: null };
    await readSSE(resp, (ev, data) => handle(cur, ev, data));
  } catch(err){
    addMsg('err', 'error: ' + err.message);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    setStatus('');
    loadSessions();
  }
}

formEl.addEventListener('submit', e => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if(!text || busy) return;
  inputEl.value = '';
  send(text);
});
inputEl.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); formEl.requestSubmit(); }
});
$('newBtn').addEventListener('click', () => {
  if(busy) return;
  sessionId = '';
  setAuto(false);
  logEl.replaceChildren();
  setStatus('');
  loadSessions();
});

$('autoApprove').addEventListener('change', e => setAuto(e.target.checked));
$('autoOff').addEventListener('click', () => setAuto(false));
// A restored page (back/forward cache) must not keep Auto approve on.
window.addEventListener('pageshow', e => { if(e.persisted) setAuto(false); });
setAuto(false);

loadSessions();
</script>
</body>
</html>
