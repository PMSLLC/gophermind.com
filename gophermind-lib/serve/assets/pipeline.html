<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<!-- This page holds a bearer token that runs shell commands, so it is
     worth more than one layer. The page loads nothing external, which lets
     connect-src stay 'self': should an escaping bug ever appear here, an
     injected script would have nowhere to send what it steals. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Task Runner - Live Pipeline</title>
<style>
  /* Layout, typography and color palette are carried over from
     docs/design/pipeline_view_mockup.html - the target this dashboard
     adapts. Additions below (marked) cover states the mockup never drew:
     escalated, a flagged-contract state, failed, unknown, plus the token/connection
     controls and the run report panel. */
  :root{
    --void:#0D1210;
    --panel:#131A17;
    --panel-2:#0F1512;
    --line:#243029;
    --ink:#E7ECE9;
    --muted:#7C8C85;
    --dim:#4B5A54;
    --phosphor:#6FDE8C;
    --amber:#E8A33D;
    --rust:#E2604B;
    --teal:#4FB8B0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--void);}
  body{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding:20px;
    gap:16px;
  }

  /* ---- header ---- */
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .masthead{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.2px;
  }
  .masthead span{color:var(--muted); font-weight:500; font-size:14px; margin-left:10px; font-family:'IBM Plex Mono', monospace;}
  .runmeta{
    display:flex;
    align-items:center;
    gap:22px;
    font-size:12.5px;
    color:var(--muted);
    flex-wrap:wrap;
  }
  .runmeta b{color:var(--ink); font-weight:600;}

  /* ---- token / connect (new: the mockup had no auth story) ---- */
  .connect{display:flex; align-items:center; gap:6px;}
  .connect input{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:inherit;
    font-size:12px;
    padding:5px 8px;
    width:170px;
  }
  .connect input:focus{outline:1px solid var(--teal);}
  .connect button{
    background:none;
    border:1px solid var(--dim);
    color:var(--muted);
    font-family:inherit;
    font-size:11.5px;
    padding:6px 10px;
    cursor:pointer;
  }
  .connect button:hover{border-color:var(--teal); color:var(--teal);}
  .connstate{font-size:10.5px; letter-spacing:0.4px; text-transform:uppercase;}
  .connstate.live{color:var(--phosphor);}
  .connstate.off{color:var(--dim);}
  .connstate.err{color:var(--rust);}

  /* ---- layout ---- */
  .board{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:16px;
    flex:1;
    min-height:0;
  }
  @media (max-width:820px){
    .board{grid-template-columns:1fr;}
  }

  /* ---- wave column ---- */
  .waves{
    display:flex;
    flex-direction:column;
    gap:14px;
    overflow-y:auto;
    padding-right:4px;
  }
  .wave-label{
    font-size:11px;
    color:var(--dim);
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .wave-label .rule{flex:1; height:1px; background:var(--line);}
  .wave-block{margin-bottom:4px;}

  .task-pill{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px 10px;
    border:1px solid var(--line);
    background:var(--panel);
    margin-bottom:6px;
    cursor:pointer;
    font-size:12.5px;
    transition:border-color 120ms ease, background 120ms ease;
  }
  .task-pill:hover{border-color:var(--dim);}
  .task-pill.active{
    border-color:var(--teal);
    background:#122320;
  }
  /* escalated and flagged-contract nodes get their own left-edge stripe on top of
     the dot below, so they read as distinct even at a glance across the
     whole wave board - not just up close. New, not in the mockup. */
  .task-pill.pill-escalated{border-left:3px solid var(--rust);}
  .task-pill.pill-contract-flagged{border-left:3px solid var(--amber);}

  .dot{
    width:8px; height:8px; flex:0 0 8px;
    border-radius:50%;
    background:var(--dim);
  }
  .dot.queued{background:var(--dim);}
  .dot.running{background:var(--amber); box-shadow:0 0 0 3px rgba(232,163,61,0.15); animation:pulse 1.4s ease-in-out infinite;}
  .dot.verified{background:var(--phosphor);}
  .dot.revisit{background:var(--rust); box-shadow:0 0 0 3px rgba(226,96,75,0.18); animation:pulse 1.4s ease-in-out infinite;}
  /* New dot treatments: needs_revision (above, "revisit") is a normal part
     of the loop, but escalated and a flagged contract both mean a human is
     needed, so each gets a static (non-pulsing, nothing to wait out) dot
     with a second ring, visually louder than "revisit" rather than folded
     into it. failed and unknown are new too, for completeness. */
  .dot.escalated{background:var(--rust); box-shadow:0 0 0 2px var(--void), 0 0 0 4px var(--rust);}
  .dot.contract-flagged{background:var(--amber); box-shadow:0 0 0 2px var(--void), 0 0 0 4px var(--amber);}
  .dot.failed{background:var(--rust);}
  .dot.unknown{background:var(--dim); border:1px dashed var(--muted);}
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.45;}
  }
  .task-pill .tname{flex:1; color:var(--ink);}
  .task-pill .tstatus{color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px;}

  /* ---- hero / detail panel ---- */
  .detail{
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
  }
  .detail-head{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    background:var(--panel-2);
  }
  .detail-head .tag{
    font-size:10.5px;
    color:var(--dim);
    letter-spacing:0.5px;
    margin-bottom:6px;
  }
  .detail-head h2{
    margin:0 0 10px 0;
    font-size:17px;
    font-weight:600;
    font-family:'IBM Plex Mono', monospace;
  }
  .spec-row{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    font-size:12px;
  }
  .spec-row div{max-width:420px;}
  .spec-row .k{color:var(--dim); font-size:10.5px; letter-spacing:0.4px; margin-bottom:3px;}
  .spec-row .v{color:var(--muted); line-height:1.5;}

  .log{
    flex:1;
    overflow-y:auto;
    padding:14px 18px;
    font-size:12.5px;
    line-height:1.6;
  }
  .log-line{
    display:grid;
    grid-template-columns:20px 190px 1fr 70px;
    gap:12px;
    align-items:baseline;
    padding:6px 0;
    border-bottom:1px solid var(--panel-2);
  }
  .log-line .idx{color:var(--dim);}
  .log-line .model{color:var(--ink);}
  .log-line .reason{color:var(--muted);}
  .log-line .verdict{text-align:right; font-weight:600; letter-spacing:0.3px;}
  .verdict.running{color:var(--amber);}
  .verdict.pass{color:var(--phosphor);}
  .verdict.fail{color:var(--rust);}

  .revisit-block{
    margin-top:10px;
    border:1px dashed var(--rust);
    background:#1A100E;
    padding:12px 14px;
    font-size:12px;
    color:#F0B7AC;
  }
  .revisit-block .k{color:var(--rust); font-size:10.5px; letter-spacing:0.4px; margin-bottom:5px; font-weight:600;}
  .revisit-block .round{margin-top:8px;}

  .foot{
    border-top:1px solid var(--line);
    padding:10px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--panel-2);
  }
  .replay{
    background:none;
    border:1px solid var(--dim);
    color:var(--muted);
    font-family:inherit;
    font-size:11.5px;
    padding:6px 12px;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  .replay:hover{border-color:var(--teal); color:var(--teal);}
  .foot .hint{font-size:11px; color:var(--dim);}

  /* ---- run report panel (new: source spec section 5's "render it as a
     final Run Report in the dashboard") ---- */
  .report-overlay{
    position:fixed; inset:0;
    background:rgba(6,9,8,0.75);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
  }
  .report-panel{
    background:var(--panel);
    border:1px solid var(--line);
    max-width:760px;
    width:100%;
  }
  .report-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    background:var(--panel-2);
  }
  .report-head h2{margin:0; font-size:16px;}
  .report-body{padding:16px 18px; font-size:12.5px;}
  table.model-stats{width:100%; border-collapse:collapse; margin-bottom:16px;}
  table.model-stats th, table.model-stats td{
    text-align:left; padding:6px 8px; border-bottom:1px solid var(--panel-2);
  }
  table.model-stats th{color:var(--dim); font-size:10.5px; letter-spacing:0.4px; text-transform:uppercase;}
  .close-report{
    background:none; border:1px solid var(--dim); color:var(--muted);
    font-family:inherit; font-size:11.5px; padding:5px 10px; cursor:pointer;
  }
  .close-report:hover{border-color:var(--teal); color:var(--teal);}
  [hidden]{display:none!important;}
  select{background:var(--panel); color:var(--ink); border:1px solid var(--line); font:inherit; padding:2px 4px;}
  .artifact-link{color:var(--teal); cursor:pointer; text-decoration:underline;}
  .check-output{white-space:pre-wrap; background:var(--void); border:1px solid var(--line); padding:8px; margin:6px 0; color:var(--muted); font-size:12px;}
  .rpt-line{margin-bottom:8px;}
  .rpt-note{color:var(--muted);}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="masthead">TASK RUNNER<span>/ live pipeline</span></div>
    <div class="runmeta">
      <div class="connect">
        <input id="tokenInput" type="password" placeholder="bearer token" autocomplete="off">
        <button id="connectBtn" type="button">connect</button>
        <span id="connState" class="connstate off">disconnected</span>
      </div>
      <div>RUN <select id="runSelect"></select></div>
      <div>STATUS <b id="runStatus">-</b></div>
      <div>NODES <b id="taskIndicator">-</b></div>
      <div>COVERAGE <b id="coverage">-</b></div>
      <div>UPDATED <b id="updatedAt">-</b></div>
      <button class="replay" id="decisionsBtn" type="button">decisions</button>
      <button class="replay" id="reportBtn" type="button">run report</button>
    </div>
  </header>

  <div class="board">
    <div class="waves" id="waves"></div>
    <div class="detail">
      <div class="detail-head">
        <div class="tag" id="detailTag">-</div>
        <h2 id="detailTitle">Connect to see the live run</h2>
        <div class="spec-row">
          <div>
            <div class="k">DELIVERABLE</div>
            <div class="v" id="detailDeliverable">-</div>
          </div>
          <div>
            <div class="k">TESTS</div>
            <div class="v" id="detailTest">-</div>
          </div>
        </div>
        <div class="spec-row">
          <div>
            <div class="k">GROUPS</div>
            <div class="v" id="detailGroups">-</div>
          </div>
          <div>
            <div class="k">DECISIONS</div>
            <div class="v" id="detailDecisions">-</div>
          </div>
        </div>
      </div>
      <div class="log" id="log"></div>
      <div class="foot">
        <div class="hint" id="hint">enter the server's bearer token above and click connect</div>
      </div>
    </div>
  </div>
</div>

<div class="report-overlay" id="reportOverlay" hidden>
  <div class="report-panel">
    <div class="report-head">
      <h2 id="overlayTitle">Run Report</h2>
      <button class="close-report" id="closeReportBtn" type="button">close</button>
    </div>
    <div class="report-body" id="reportBody">-</div>
  </div>
</div>

<script>
// The engine's node statuses map to the dot and pill styling here and nowhere
// else. The label shown next to a node is always the engine's own status
// string; this map only picks how it is drawn. failed and escalated get their
// own treatment because they are the states most likely to need a person.
// Every server value is written with textContent; no server string is ever
// parsed as markup.
const STATUS_META = {
  pending:        { dot: 'queued' },
  ready:          { dot: 'queued' },
  claimed:        { dot: 'running' },
  in_progress:    { dot: 'running' },
  verified:       { dot: 'verified' },
  needs_revision: { dot: 'revisit' },
  failed:         { dot: 'failed' },
  escalated:      { dot: 'escalated', pill: 'pill-escalated' },
};
const TERMINAL = ['verified', 'failed', 'escalated', 'interrupted', 'harness_fault', 'invalid_brief'];
function statusMetaFor(status){
  return STATUS_META[status] || { dot: 'unknown' };
}

// el builds an element; text goes in through textContent.
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = String(text);
  return e;
}

let nodes = [];        // NodeSummary list of the selected run, never demo data
let current = null;    // selected node id
let runId = '';
let authToken = '';
let lastSeq = 0;       // last event id seen; sent as since= on every (re)connect
let stateSeq = 0;      // event_seq of the last applied state; frames at or below it are already in that state
let stateReq = 0;      // request counters: only the newest response of each kind may render
let nodeReq = 0;
let artReq = 0;
let openArtifact = null; // { key, nodeId, pre }: the one open saved-output block
let lastLogNode = '';
let eventsAbort = null;
let eventsGen = 0;
let finalReport = null; // the report of a finished run, kept from resync
let stateLoading = false; // a state request is in flight: node frames wait in queuedFrames
let queuedFrames = [];    // { event, num, data } node frames received during a state load

const $ = id => document.getElementById(id);
const wavesEl = $('waves'), logEl = $('log'), titleEl = $('detailTitle'), tagEl = $('detailTag');
const delivEl = $('detailDeliverable'), testEl = $('detailTest'), groupsEl = $('detailGroups'), decEl = $('detailDecisions');
const taskIndicator = $('taskIndicator'), updatedAtEl = $('updatedAt'), statusEl = $('runStatus'), coverageEl = $('coverage');
const connStateEl = $('connState'), tokenInput = $('tokenInput'), connectBtn = $('connectBtn'), hintEl = $('hint');
const runSelect = $('runSelect'), reportBtn = $('reportBtn'), decisionsBtn = $('decisionsBtn');
const reportOverlay = $('reportOverlay'), reportBody = $('reportBody'), overlayTitle = $('overlayTitle'), closeReportBtn = $('closeReportBtn');

function authHeaders(){
  return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
}

function withQuery(path, params){
  const u = new URLSearchParams();
  Object.keys(params || {}).forEach(k => { if(params[k] !== '' && params[k] != null) u.set(k, params[k]); });
  const s = u.toString();
  return s ? path + '?' + s : path;
}

// getJSON checks the schema header before it trusts a body: a server that
// speaks another contract version is reported, not half-rendered.
async function getJSON(path, params){
  const resp = await fetch(withQuery(path, params), { headers: authHeaders() });
  if(resp.headers.get('X-Gophermind-Pipeline-Schema') !== '1'){
    throw new Error('this server and this page disagree about the pipeline contract; update the older one');
  }
  if(!resp.ok){
    throw new Error('GET ' + path + ': ' + resp.status);
  }
  return resp.json();
}

function findNode(id){ return nodes.find(n => n.id === id); }
function leafNodes(){ return nodes.filter(n => n.kind === 'function'); }

function renderHeader(run){
  statusEl.textContent = run ? run.status + (run.stop_reason ? ' / ' + run.stop_reason : '') : '-';
  coverageEl.textContent = run ? run.coverage.covered + '/' + run.coverage.total : '-';
}

function treeBlock(label, leaves){
  const block = el('div', 'wave-block');
  const lab = el('div', 'wave-label', label);
  lab.appendChild(el('div', 'rule'));
  block.appendChild(lab);
  leaves.forEach(n => {
    const meta = statusMetaFor(n.status);
    const pill = el('div', 'task-pill' + (n.id === current ? ' active' : '') + (meta.pill ? ' ' + meta.pill : ''));
    pill.dataset.id = n.id;
    pill.appendChild(el('div', 'dot ' + meta.dot));
    const rev = n.revision > 0 ? ', rev ' + n.revision : '';
    pill.appendChild(el('div', 'tname', (n.title || n.id) + ' (w' + n.wave + ', ' + n.attempt_count + ' att' + rev + ')'));
    pill.appendChild(el('div', 'tstatus', n.status));
    pill.addEventListener('click', () => loadNode(n.id));
    block.appendChild(pill);
  });
  return block;
}

// The tree: one block per component, its function nodes below it. Function
// nodes whose parent is not a listed component go in a last block.
function renderTree(){
  wavesEl.replaceChildren();
  const leaves = leafNodes();
  taskIndicator.textContent = leaves.filter(n => n.status === 'verified').length + '/' + leaves.length;
  const comps = nodes.filter(n => n.kind === 'component');
  const known = new Set(comps.map(c => c.id));
  comps.forEach(c => wavesEl.appendChild(treeBlock(c.title || c.id, leaves.filter(n => n.parent === c.id))));
  const loose = leaves.filter(n => !known.has(n.parent));
  if(loose.length) wavesEl.appendChild(treeBlock('(ungrouped)', loose));
}

function renderAttemptLine(a, idx){
  const line = el('div', 'log-line');
  line.appendChild(el('div', 'idx', String(idx + 1).padStart(2, '0')));
  line.appendChild(el('div', 'model', a.model));
  const tests = a.tests_total ? ' [' + a.tests_passed + '/' + a.tests_total + ' tests]' : '';
  line.appendChild(el('div', 'reason', (a.revision > 0 ? 'rev ' + a.revision + ': ' : '') + (a.failure_reason || '') + tests));
  // Transform the raw value, then show it: never case-transform escaped text.
  const v = a.verdict == null ? '' : String(a.verdict);
  const label = v === 'pass' ? 'PASSED' : (v === 'fail' ? 'FAILED' : v.toUpperCase());
  const verdict = el('div', 'verdict', label);
  if(v === 'pass' || v === 'fail' || v === 'running') verdict.classList.add(v);
  line.appendChild(verdict);
  return line;
}

function groupSummary(doc){
  const parts = [];
  if(doc.rationale) parts.push('why: ' + doc.rationale);
  if(doc.construction && doc.construction.approach_chosen) parts.push('how: ' + doc.construction.approach_chosen);
  if(doc.security && doc.security.trust_boundary) parts.push('trust boundary: ' + doc.security.trust_boundary);
  if(doc.performance && doc.performance.complexity) parts.push('complexity: ' + doc.performance.complexity);
  return parts.join(' | ') || '(no groups)';
}

function artifactKey(id, attempt, file){ return id + '|' + attempt + '|' + file; }

// placeArtifact puts the open artifact block back under its link after the log
// was rebuilt. The block itself is never recreated by a re-render.
function placeArtifact(){
  if(!openArtifact) return;
  const key = openArtifact.key;
  const link = Array.from(logEl.children).find(c => c.dataset && c.dataset.key === key);
  if(link) link.insertAdjacentElement('afterend', openArtifact.pre);
}

async function showArtifact(id, attempt, file){
  const req = ++artReq;
  const run = runId;
  let text;
  try{
    const resp = await fetch(withQuery('/pipeline/artifact', { run: run, id: id, attempt: attempt, file: file }), { headers: authHeaders() });
    text = resp.ok ? await resp.text() : 'GET artifact failed: ' + resp.status;
  } catch(err){
    text = 'artifact load failed: ' + (err && err.message ? err.message : 'error');
  }
  if(req !== artReq || run !== runId || current !== id) return;
  if(openArtifact) openArtifact.pre.remove();
  const pre = el('pre', 'check-output', text);
  openArtifact = { key: artifactKey(id, attempt, file), nodeId: id, pre: pre };
  placeArtifact();
}

function renderLog(body, id){
  const atBottom = lastLogNode !== id || logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight <= 8;
  lastLogNode = id;
  if(openArtifact && openArtifact.nodeId !== id) openArtifact = null;
  logEl.replaceChildren();
  const attempts = (body.runtime && body.runtime.attempts) || [];
  if(!attempts.length){
    const empty = el('div', 'log-line');
    empty.style.gridTemplateColumns = '1fr';
    empty.appendChild(el('div', 'reason', body.runtime ? 'No attempts recorded yet.' : 'Queued - the executor has not started this node.'));
    logEl.appendChild(empty);
  }
  attempts.forEach((a, i) => logEl.appendChild(renderAttemptLine(a, i)));
  (body.artifacts || []).forEach(art => {
    (art.files || []).filter(f => f === 'check-output.txt' || f === 'reply.txt').forEach(f => {
      const link = el('div', 'log-line artifact-link', 'saved attempt ' + art.attempt + ': ' + f);
      link.style.gridTemplateColumns = '1fr';
      link.dataset.key = artifactKey(id, art.attempt, f);
      link.addEventListener('click', () => showArtifact(id, art.attempt, f));
      logEl.appendChild(link);
    });
  });
  placeArtifact();
  if(atBottom) logEl.scrollTop = logEl.scrollHeight;
}

async function loadNode(id){
  current = id;
  renderTree();
  const req = ++nodeReq;
  const run = runId;
  let body;
  try{
    body = await getJSON('/pipeline/node', { run: run, id: id });
  } catch(err){
    if(req === nodeReq) hintEl.textContent = err.message;
    return;
  }
  if(req !== nodeReq || current !== id || run !== runId) return;
  const doc = body.node || {};
  const summary = findNode(id) || {};
  tagEl.textContent = 'WAVE ' + (summary.wave || 0) + ' / ' + String(doc.kind || '').toUpperCase() +
    (doc.model_tier ? ' / ' + doc.model_tier : '') + (doc.node_class ? ' / ' + doc.node_class : '') +
    (summary.revision > 0 ? ' / rev ' + summary.revision : '');
  titleEl.textContent = doc.title || id;
  delivEl.textContent = doc.description || '(no description)';
  const tests = (doc.tests || []).map(t => t.name);
  testEl.textContent = tests.length ? tests.join('; ') : '(no tests)';
  groupsEl.textContent = groupSummary(doc);
  decEl.textContent = (doc.decisions || []).map(d => d.question + ' -> ' + d.answer).join('; ') || '(none)';
  renderLog(body, id);
}

async function loadRuns(){
  const body = await getJSON('/pipeline/runs');
  runSelect.replaceChildren();
  body.runs.forEach(r => {
    runSelect.appendChild(el('option', '', r.run_id + ' ' + r.status)).value = r.run_id;
  });
  if(!runId && body.runs.length) runId = body.runs[0].run_id;
  runSelect.value = runId;
}

// loadState returns the body it applied, or null when a newer request or a run
// switch made its response stale (a stale response must not overwrite newer data).
// Node frames that arrive while the request is in flight are queued, not
// applied to the old nodes (the snapshot would replace them and the stream
// never resends them); the newest response replays the queued frames newer
// than its event_seq. A stale response leaves the queue to the newer request,
// and a failed newest request applies the queue to the old state.
async function loadState(){
  const req = ++stateReq;
  const run = runId;
  stateLoading = true;
  let body;
  try{
    body = await getJSON('/pipeline/state', { run: run });
  } catch(err){
    if(req === stateReq && run === runId && flushQueuedFrames()) renderTree();
    throw err;
  }
  if(req !== stateReq || run !== runId) return null;
  nodes = body.nodes || [];
  stateSeq = Number.isFinite(body.event_seq) ? body.event_seq : 0;
  lastSeq = Math.max(lastSeq, stateSeq);
  flushQueuedFrames();
  updatedAtEl.textContent = new Date(body.generated_at).toLocaleTimeString();
  renderHeader(body.run);
  if(!current){
    const first = leafNodes()[0];
    if(first) current = first.id;
  }
  renderTree();
  if(current) await loadNode(current);
  return body;
}

// resync runs after every successful (re)connect of the event stream. The
// server never replays derived events (run-status, run-report), so a run that
// ended while this page was away would stay "building" with no report. It
// refetches the state and, when the run is over, the final report. It returns
// false when the fetch failed, so the caller reconnects instead of streaming
// into an empty page.
async function resync(){
  const run = runId;
  try{
    const body = await loadState();
    if(body && body.run && TERMINAL.indexOf(body.run.status) !== -1){
      const rep = await getJSON('/pipeline/report', { run: run });
      if(run === runId){
        finalReport = rep;
        setReportLabel(rep);
      }
    }
    return true;
  } catch(err){
    hintEl.textContent = err.message;
    return false;
  }
}

function table(headers, rows){
  const t = el('table', 'model-stats');
  const head = el('tr');
  headers.forEach(h => head.appendChild(el('th', '', h)));
  t.appendChild(el('thead')).appendChild(head);
  const tb = el('tbody');
  rows.forEach(r => {
    const tr = el('tr');
    r.forEach(c => tr.appendChild(el('td', '', c)));
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  return t;
}

// cnt shows a count the server may have left out as a dash, never "undefined".
function cnt(v){ return v == null ? '-' : v; }

function setReportLabel(r){
  reportBtn.textContent = r && r.complete === false ? 'run report' : 'run report (final)';
}

// renderReport fills the panel only; opening it is the user's click.
function renderReport(r){
  const n = r.nodes || {}, cov = r.requirements_covered || {};
  reportBody.replaceChildren();
  reportBody.appendChild(el('div', 'rpt-line', (r.status || '-') + (r.complete === false ? ' (running)' : '') +
    ' | nodes ' + cnt(n.verified) + '/' + cnt(n.total) + ' verified, ' + cnt(n.failed) + ' failed, ' + cnt(n.escalated) + ' escalated | requirements ' + cnt(cov.covered) + '/' + cnt(cov.total)));
  if(r.parallel){
    reportBody.appendChild(el('div', 'rpt-line rpt-note', 'parallel: workers ' + cnt(r.parallel.workers) + ', levels ' + cnt(r.parallel.parallel_levels) + ', landing conflicts ' + cnt(r.parallel.landing_conflicts)));
  }
  reportBody.appendChild(table(['task', 'model', 'calls', 'ok', 'malformed', 'retries', 'model esc.', 'avg ms'],
    (r.by_task_type || []).map(m => [m.task_type, m.model, m.calls, m.ok, m.malformed, m.retries, m.model_escalations, m.avg_duration_ms].map(cnt))));
  reportBody.appendChild(table(['leaf model', 'attempts', 'passes', 'pass rate', 'first try'],
    (r.leaves || []).map(m => [m.model, m.attempts, m.passes, ((m.pass_rate || 0) * 100).toFixed(0) + '%', m.first_try_wins].map(cnt))));
  const revised = r.revised_leaves || [];
  if(revised.length){
    reportBody.appendChild(el('div', 'k', 'REVISED LEAVES'));
    reportBody.appendChild(table(['node', 'revisions', 'flag', 'tests rewritten'],
      revised.map(x => [x.node_id, x.revisions, x.flag || '', x.tests_rewritten ? 'yes' : ''].map(cnt))));
  }
  const fails = r.failures || [];
  if(fails.length){
    reportBody.appendChild(el('div', 'k', 'FAILURES'));
    fails.forEach(f => reportBody.appendChild(el('div', '', f)));
  }
  overlayTitle.textContent = 'Run Report';
}

async function showReport(){
  try{
    const r = finalReport && finalReport.complete !== false ? finalReport : await getJSON('/pipeline/report', { run: runId });
    renderReport(r);
  } catch(err){
    overlayTitle.textContent = 'Run Report';
    reportBody.textContent = err.message;
  }
  reportOverlay.hidden = false;
}

async function showDecisions(){
  overlayTitle.textContent = 'Decisions';
  reportBody.replaceChildren();
  try{
    const body = await getJSON('/pipeline/decisions', { run: runId });
    const list = body.decisions || [];
    list.forEach(d => {
      const box = el('div', 'rpt-line');
      box.appendChild(el('b', '', d.id));
      box.appendChild(document.createTextNode(' (round ' + d.round + ', ' + d.answered_by + '): ' + d.question));
      box.appendChild(el('br'));
      box.appendChild(el('span', 'rpt-note', 'answer: ' + d.answer));
      reportBody.appendChild(box);
    });
    if(!list.length) reportBody.appendChild(el('div', 'rpt-note', 'No decisions recorded.'));
  } catch(err){
    reportBody.textContent = err.message;
  }
  reportOverlay.hidden = false;
}

// applyNodeFrame changes the nodes array for one node frame and renders
// nothing; the callers render.
function applyNodeFrame(event, data){
  const n = findNode(data.id);
  if(!n) return;
  if(event === 'node-status'){
    n.status = data.status; n.wave = data.wave; n.revision = data.revision;
  } else if(event === 'node-attempt'){
    if(!(n.last_attempt && n.last_attempt.started_at === data.attempt.started_at)){
      n.last_attempt = data.attempt;
      n.attempt_count = (n.attempt_count || 0) + 1;
    }
  } else if(event === 'node-result'){
    n.result = data.result;
  }
}

// flushQueuedFrames ends a state load: it applies the node frames that arrived
// while the request was in flight and are newer than stateSeq, in order, and
// empties the queue. It returns whether any frame was applied.
function flushQueuedFrames(){
  const q = queuedFrames;
  queuedFrames = [];
  stateLoading = false;
  let applied = false;
  q.forEach(f => {
    if(f.num <= stateSeq) return;
    applyNodeFrame(f.event, f.data);
    applied = true;
  });
  return applied;
}

function applyEvent(event, data){
  if(event === 'node-status' || event === 'node-attempt'){
    applyNodeFrame(event, data);
    renderTree();
    if(current === data.id) loadNode(data.id);
  } else if(event === 'node-result'){
    applyNodeFrame(event, data);
  } else if(event === 'wave-changed'){
    hintEl.textContent = 'wave ' + data.wave + ' ' + data.state;
  } else if(event === 'run-status'){
    loadRuns().catch(() => {});
    loadState().catch(() => {});
  } else if(event === 'run-report'){
    finalReport = data;
    setReportLabel(data);
  }
}

// NODE_EVENTS are the frames that change one node incrementally; only these
// can be replays of what a loaded state already holds.
const NODE_EVENTS = ['node-status', 'node-attempt', 'node-result'];

// handleFrame applies one SSE frame. Node frames whose id is at or below
// stateSeq are already part of the loaded state (a resync replays them), so
// applying them again would double attempt counts and regress statuses.
// Derived frames (run-status, wave-changed, run-report) carry the id of the
// latest event line, so their id can equal stateSeq; they are absolute sets
// and are always applied. Every numeric id advances lastSeq; a frame without
// one leaves it alone.
function handleFrame(event, id, data){
  const num = id === '' || id == null ? NaN : Number(id);
  if(NODE_EVENTS.indexOf(event) !== -1 && num <= stateSeq) return;
  if(Number.isFinite(num)) lastSeq = Math.max(lastSeq, num);
  let parsed;
  try{ parsed = JSON.parse(data); } catch(e){ return; }
  if(!parsed || typeof parsed !== 'object') return;
  if(stateLoading && NODE_EVENTS.indexOf(event) !== -1){
    queuedFrames.push({ event: event, num: num, data: parsed });
    return;
  }
  applyEvent(event, parsed);
}

// parseSSEStream reads a fetch Response body as an SSE stream and calls
// onFrame(event, id, data) for each frame. A plain browser EventSource cannot
// carry an Authorization header, and every pipeline route requires the bearer
// token, so the stream is read through fetch. Comment frames (keepalives) have
// no event line and are skipped.
async function parseSSEStream(resp, onFrame){
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while(true){
    const { value, done } = await reader.read();
    if(done) break;
    buf += decoder.decode(value, { stream: true });
    let sep;
    while((sep = buf.indexOf('\n\n')) !== -1){
      const frame = buf.slice(0, sep);
      buf = buf.slice(sep + 2);
      let event = '', id = '';
      const dataLines = [];
      frame.split('\n').forEach(line => {
        if(line.startsWith('event: ')) event = line.slice(7);
        else if(line.startsWith('id: ')) id = line.slice(4);
        else if(line.startsWith('data: ')) dataLines.push(line.slice(6));
      });
      if(event) onFrame(event, id, dataLines.join('\n'));
    }
  }
}

// connectEvents keeps one stream open for the selected run and reconnects
// after a drop, resuming at the last id it saw (since=). After every
// successful connect it resyncs, because derived events are not replayed.
// 401, 403 and 404 stop the retries (the token or the run is wrong, and
// asking again every 2 s fixes neither); other errors back off up to 30 s.
async function connectEvents(){
  if(eventsAbort) eventsAbort.abort();
  const gen = ++eventsGen;
  eventsAbort = new AbortController();
  const signal = eventsAbort.signal;
  let fails = 0;
  while(gen === eventsGen){
    connStateEl.textContent = 'connecting';
    connStateEl.className = 'connstate off';
    try{
      const resp = await fetch(withQuery('/pipeline/events', { run: runId, since: String(lastSeq) }), { headers: authHeaders(), signal: signal });
      if(gen !== eventsGen) return;
      if(resp.headers.get('X-Gophermind-Pipeline-Schema') !== '1' || !resp.ok){
        connStateEl.textContent = 'error ' + resp.status;
        connStateEl.className = 'connstate err';
        if(resp.status === 401 || resp.status === 403 || resp.status === 404){
          hintEl.textContent = 'the event stream was refused (' + resp.status + '); check the token and the run, then click connect';
          return;
        }
        fails++;
      } else {
        connStateEl.textContent = 'live';
        connStateEl.className = 'connstate live';
        if(!(await resync())) throw new Error('resync failed');
        if(gen !== eventsGen) return;
        fails = 0;
        await parseSSEStream(resp, (event, id, data) => {
          if(gen !== eventsGen) return;
          handleFrame(event, id, data);
        });
      }
    } catch(err){
      if(signal.aborted || gen !== eventsGen) return;
      connStateEl.textContent = 'error';
      connStateEl.className = 'connstate err';
      fails++;
    }
    if(gen !== eventsGen) return;
    const delay = Math.min(30000, 2000 * Math.pow(2, Math.max(0, fails - 1)));
    await new Promise(r => setTimeout(r, delay));
  }
}

// connect loads the run list and opens the stream; the stream's own resync
// loads the state, so state is fetched once and not twice.
async function connect(){
  authToken = tokenInput.value.trim();
  hintEl.textContent = 'click a node on the left to inspect it';
  try{
    await loadRuns();
  } catch(err){
    hintEl.textContent = 'failed to load the pipeline: ' + err.message;
    return;
  }
  connectEvents();
}

// switchRun drops everything that belongs to the old run (its stream first, so
// none of its frame ids can raise the new run's counters) and reconnects. The
// reconnect loads the state itself and keeps retrying if that fails.
function switchRun(id){
  eventsGen++;
  if(eventsAbort){ eventsAbort.abort(); eventsAbort = null; }
  runId = id;
  current = null;
  nodes = [];
  lastSeq = 0;
  stateSeq = 0;
  stateReq++;
  stateLoading = false;
  queuedFrames = [];
  nodeReq++;
  artReq++;
  openArtifact = null;
  lastLogNode = '';
  finalReport = null;
  reportBtn.textContent = 'run report';
  renderHeader(null);
  renderTree();
  connectEvents();
}

connectBtn.addEventListener('click', connect);
tokenInput.addEventListener('keydown', e => { if(e.key === 'Enter') connect(); });
reportBtn.addEventListener('click', showReport);
decisionsBtn.addEventListener('click', showDecisions);
closeReportBtn.addEventListener('click', () => { reportOverlay.hidden = true; });
runSelect.addEventListener('change', () => switchRun(runSelect.value));

// Convenience: a token passed in the URL fragment (#token=...) auto-connects.
// The fragment, unlike the query string, is never sent to the server, never
// appears in a Referer header, and is not written to access logs; a bearer
// token here can run shell commands, so a leak of it is a leak of code
// execution. It is read once and the address bar is cleared at once. There is
// no query-string fallback: a fallback that works is a fallback people will use.
if(location.hash){
  const fragToken = new URLSearchParams(location.hash.slice(1)).get('token');
  history.replaceState(null, '', location.pathname);
  if(fragToken){
    tokenInput.value = fragToken;
    connect();
  }
}

// Behind Google sign-in the browser holds a session cookie and the server adds
// the bearer token itself, so a valid session needs no token typed. With
// sign-in off /auth/me does not exist (or answers 401) and the token flow above
// is the only way in.
if(!tokenInput.value){
  fetch('/auth/me', { credentials: 'same-origin' }).then(r => {
    if(r.ok && !tokenInput.value){
      tokenInput.placeholder = 'signed in';
      tokenInput.disabled = true;
      connectBtn.hidden = true;
      connect();
    }
  }).catch(() => {});
}
</script>
