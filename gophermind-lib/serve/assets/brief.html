<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<!-- Run data is put on the page with textContent only, never as markup; the
     policy below is a second layer should that ever slip. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'self'">
<title>Run - GopherMind</title>
<style>
/*GM_CSS*/
</style>
</head>
<body class="gm-brief">
<div class="shell">
<!--GM_RAIL-->
<main class="main">
<div class="head">
  <h1 id="title">Run</h1>
  <div class="actions"><button id="resubmit" type="button" hidden>Resubmit this brief</button><button id="stop" type="button" hidden>Stop this run</button><span id="stopmsg" class="err"></span></div>
  <div class="meta" id="head"></div>
</div>
<div id="load" class="meta">Loading...</div>

<div id="progress" class="progress" hidden>
  <div class="ptext"><span id="ptitle"></span><span id="pnum"></span></div>
  <div class="pbar"><div id="pfill" class="pfill"></div></div>
</div>

<div id="strip"></div>

<div id="problems" hidden>
  <h2>Problems</h2>
  <ul id="problist" class="problems"></ul>
</div>

<h2>Decomposition</h2>
<div id="counts" class="meta"></div>
<div id="tree"></div>

<div id="timing" hidden>
  <h2>Where the time went</h2>
  <div id="stages"></div>
  <div id="slow"></div>
</div>

<h2>Wave checks</h2>
<div id="waves"></div>

<h2>Repairs</h2>
<div id="repairs"></div>

<h2>Clarify questions</h2>
<div id="questions"></div>

<h2>Acceptance</h2>
<div id="accept"></div>

<h2>Understanding</h2>
<details id="udet"><summary>Show</summary><pre id="understanding"></pre></details>

<h2>Log</h2>
<pre id="log"></pre>
</main>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const m = /^\/app\/briefs\/(gm-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{3})\/?$/.exec(window.location.pathname);
const runId = m ? m[1] : '';
const opened = new Set();

// el builds an element; text only ever goes in through textContent.
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function pill(text, extra){
  const s = el('span', 'pill ' + (extra || text || ''), text || '-');
  return s;
}
function phaseClass(p){
  if (p === 'planning' || p === 'running' || p === 'waiting') return 'live';
  if (p === 'done') return 'good';
  if (p === 'failed' || p === 'stopped' || p === 'interrupted') return 'bad';
  return '';
}

function when(iso){
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const STRIP = [
  ['verified', 's-verified', ['verified']],
  ['running', 's-running', ['running', 'building', 'claimed']],
  ['blocked', 's-blocked', ['blocked']],
  ['failed', 's-failed', ['failed', 'escalated']]
];
function renderStrip(c){
  const box = $('strip');
  box.textContent = '';
  const total = c.nodes || 0;
  if (!total) return;
  const by = c.by_status || {};
  const bar = el('div', 'strip');
  bar.setAttribute('role', 'img');
  const legend = el('div', 'legend');
  let counted = 0;
  for (const [label, cls, keys] of STRIP) {
    let n = 0;
    for (const k of keys) n += by[k] || 0;
    counted += n;
    if (!n) continue;
    const seg = el('span', cls);
    seg.style.width = (100 * n / total) + '%';
    bar.appendChild(seg);
    const item = el('span');
    item.appendChild(el('i', cls));
    item.appendChild(el('b', '', n));
    item.appendChild(document.createTextNode(' ' + label));
    legend.appendChild(item);
  }
  const rest = total - counted;
  if (rest > 0) {
    const item = el('span');
    item.appendChild(el('i'));
    item.appendChild(el('b', '', rest));
    item.appendChild(document.createTextNode(' not started'));
    legend.appendChild(item);
  }
  bar.setAttribute('aria-label', total + ' leaves');
  box.appendChild(bar);
  box.appendChild(legend);
}

function renderHead(run){
  $('title').textContent = run.title || 'Run';
  const h = $('head');
  h.textContent = '';
  h.appendChild(el('span', 'mono', run.id));
  h.appendChild(document.createTextNode('  '));
  h.appendChild(pill(run.phase || 'external', phaseClass(run.phase)));
  h.appendChild(document.createTextNode(' '));
  h.appendChild(pill(run.status || 'not created yet', run.status === 'verified' ? 'good' : ''));
  if (run.stop_reason) h.appendChild(document.createTextNode('  Stopped: ' + run.stop_reason));
  if (run.started_at) h.appendChild(document.createTextNode('  Started ' + when(run.started_at)));
  if (run.finished_at) h.appendChild(document.createTextNode('  Finished ' + when(run.finished_at)));
  if (run.exit_code !== null && run.exit_code !== undefined) h.appendChild(document.createTextNode('  Exit code ' + run.exit_code));
  if (run.error) { h.appendChild(document.createTextNode('  ')); h.appendChild(el('span', 'err', run.error)); }
  $('stop').hidden = !run.active;
  $('resubmit').hidden = !!run.active;
  const c = run.counts || {};
  renderStrip(c);
  const parts = [];
  for (const k of Object.keys(c.by_status || {}).sort()) parts.push(k + ' ' + c.by_status[k]);
  $('counts').textContent = (c.nodes || 0) + ' leaves' + (parts.length ? ' (' + parts.join(', ') + ')' : '') +
    '; waves ' + (run.waves || 0) + '; requirements covered ' + ((run.coverage || {}).covered || 0) + ' of ' + ((run.coverage || {}).total || 0);
}

function fmtMs(ms){
  ms = Number(ms) || 0;
  if (ms < 1000) return ms + ' ms';
  const sec = Math.round(ms / 1000);
  if (sec < 60) return sec + ' s';
  const mn = Math.floor(sec / 60);
  if (mn < 60) return mn + ' min ' + (sec % 60) + ' s';
  return Math.floor(mn / 60) + ' h ' + (mn % 60) + ' min';
}

// goNode opens a leaf's attempts when a problem links to it; the tree is
// rebuilt on every update, so the choice is kept in opened.
function goNode(id){
  opened.add(id);
  const li = $('node-' + id);
  const d = li ? li.querySelector('details') : null;
  if (d) d.open = true;
}

// renderProblems names each failed or blocked leaf with its last reason.
// Older states have no problems field: failed leaves then come from the tree.
function renderProblems(s){
  const nodes = s.nodes || [];
  const byId = {};
  for (const n of nodes) byId[n.id] = n;
  const items = [];
  const seen = new Set();
  const failed = s.problems || nodes.filter(n => n.kind === 'function' && n.status === 'failed').map(n => {
    const last = (n.attempts || [])[(n.attempts || []).length - 1] || {};
    return { node: n.id, title: n.title, attempts: (n.attempts || []).length, class: last.outcome || '', reason: last.failure_reason || '', malformed_reason: last.malformed_reason || '' };
  });
  for (const p of failed) {
    seen.add(p.node);
    let text = p.reason || 'no reason recorded';
    if (p.malformed_reason) text += ' (' + p.malformed_reason + ')';
    const tail = p.attempts ? ' after ' + p.attempts + ' attempt' + (p.attempts === 1 ? '' : 's') : '';
    items.push({ id: p.node, status: 'failed', title: p.title, text: (p.class ? p.class + ': ' : '') + text + tail });
  }
  for (const n of nodes) {
    if (n.kind !== 'function' || n.status !== 'blocked' || seen.has(n.id)) continue;
    const bad = (n.depends_on || []).filter(d => byId[d] && (byId[d].status === 'failed' || byId[d].status === 'blocked'));
    items.push({ id: n.id, status: 'blocked', title: n.title, text: 'waiting on ' + (bad.length ? bad.join(', ') : 'a failed leaf') });
  }
  const box = $('problems');
  const ul = $('problist');
  ul.textContent = '';
  box.hidden = !items.length;
  for (const it of items) {
    const li = el('li');
    li.appendChild(pill(it.status));
    const a = el('a', 'id', ' ' + it.id);
    a.href = '#node-' + it.id;
    a.addEventListener('click', () => goNode(it.id));
    li.appendChild(a);
    if (it.title) li.appendChild(el('span', 'sub', it.title));
    li.appendChild(el('div', 'why', it.text));
    ul.appendChild(li);
  }
}

// renderProgress shows how far the current step has got; the bar slides when
// the size of the step is not known.
function renderProgress(p){
  const box = $('progress');
  box.hidden = !p;
  if (!p) return;
  $('ptitle').textContent = p.step + ': ' + p.label;
  const f = $('pfill');
  if (p.total > 0) {
    f.className = 'pfill';
    f.style.width = p.percent + '%';
    $('pnum').textContent = p.done + ' of ' + p.total + ' (' + p.percent + '%)';
  } else {
    f.className = 'pfill unknown';
    f.style.width = '';
    $('pnum').textContent = p.calls ? p.calls + ' model calls so far' : 'working';
  }
}

// renderTiming shows the model-call totals per stage and the slowest calls.
function renderTiming(stages, slow){
  const box = $('timing');
  box.hidden = !stages.length;
  const sb = $('stages');
  sb.textContent = '';
  const sl = $('slow');
  sl.textContent = '';
  if (!stages.length) return;
  const t = el('table');
  const hr = el('tr');
  for (const c of ['stage', 'calls', 'problems', 'time', 'tokens']) hr.appendChild(el('th', '', c));
  t.appendChild(hr);
  for (const g of stages) {
    const tr = el('tr');
    tr.appendChild(el('td', '', g.stage));
    tr.appendChild(el('td', '', g.calls));
    const pc = el('td');
    if (g.problems) pc.appendChild(el('span', 'err', g.problems)); else pc.textContent = '0';
    tr.appendChild(pc);
    tr.appendChild(el('td', '', fmtMs(g.duration_ms)));
    tr.appendChild(el('td', '', g.tokens));
    t.appendChild(tr);
  }
  sb.appendChild(t);
  if (!slow.length) return;
  const d = el('details');
  d.appendChild(el('summary', '', 'Slowest calls'));
  const t2 = el('table');
  const h2 = el('tr');
  for (const c of ['stage', 'leaf', 'time', 'tokens', 'outcome']) h2.appendChild(el('th', '', c));
  t2.appendChild(h2);
  for (const c of slow) {
    const tr = el('tr');
    tr.appendChild(el('td', '', c.stage));
    tr.appendChild(el('td', '', c.node));
    tr.appendChild(el('td', '', fmtMs(c.duration_ms)));
    tr.appendChild(el('td', '', c.tokens));
    const o = el('td'); o.appendChild(pill(c.outcome === 'ok' ? 'pass' : c.outcome, c.outcome === 'ok' ? 'pass' : 'fail')); tr.appendChild(o);
    t2.appendChild(tr);
  }
  d.appendChild(t2);
  sl.appendChild(d);
}

function attemptTable(n){
  const t = el('table');
  const hr = el('tr');
  const hasModel = n.attempts.some(a => a.model), hasProv = n.attempts.some(a => a.provider);
  const cols = ['#'].concat(hasModel ? ['model'] : [], hasProv ? ['provider'] : [], ['outcome', 'tests', 'ms', 'reason']);
  for (const c of cols) hr.appendChild(el('th', '', c));
  t.appendChild(hr);
  for (const a of n.attempts) {
    const tr = el('tr');
    tr.appendChild(el('td', '', a.n));
    if (hasModel) tr.appendChild(el('td', '', a.model));
    if (hasProv) tr.appendChild(el('td', '', a.provider));
    const o = el('td'); o.appendChild(pill(a.outcome)); tr.appendChild(o);
    tr.appendChild(el('td', '', a.tests_passed + '/' + a.tests_total));
    tr.appendChild(el('td', '', a.duration_ms));
    tr.appendChild(el('td', '', a.failure_reason));
    t.appendChild(tr);
  }
  return t;
}

function renderNode(n, kids){
  const li = el('li', 'node');
  li.id = 'node-' + n.id;
  const head = [pill(n.status), el('span', 'id', ' ' + n.id), el('span', 'sub', n.title ? n.title : '')];
  if (n.kind === 'function') head.push(el('span', 'sub', 'wave ' + n.wave));
  if (n.origin) head.push(el('span', 'origin', 'origin: ' + n.origin));
  if (n.depends_on.length) head.push(el('span', 'sub', 'needs ' + n.depends_on.join(', ')));
  if (n.requirement_ids.length) head.push(el('span', 'sub', 'covers ' + n.requirement_ids.join(', ')));
  if (n.attempts.length) {
    const d = el('details');
    if (opened.has(n.id)) d.open = true;
    d.addEventListener('toggle', () => { if (d.open) opened.add(n.id); else opened.delete(n.id); });
    const s = el('summary');
    for (const h of head) s.appendChild(h);
    s.appendChild(el('span', 'sub', n.attempts.length + ' attempt' + (n.attempts.length === 1 ? '' : 's')));
    d.appendChild(s);
    d.appendChild(attemptTable(n));
    li.appendChild(d);
  } else {
    for (const h of head) li.appendChild(h);
  }
  if (kids && kids.length) li.appendChild(renderList(kids, false));
  return li;
}

let byParent = {};
function renderList(nodes, top){
  const ul = el('ul', 'tree' + (top ? ' top' : ''));
  for (const n of nodes) ul.appendChild(renderNode(n, byParent[n.id]));
  return ul;
}

function renderTree(nodes){
  const t = $('tree');
  t.textContent = '';
  if (!nodes.length) { t.appendChild(el('div', 'meta', 'No plan yet.')); return; }
  const ids = new Set(nodes.map(n => n.id));
  byParent = {};
  const roots = [];
  for (const n of nodes) {
    if (n.parent && ids.has(n.parent)) (byParent[n.parent] = byParent[n.parent] || []).push(n);
    else roots.push(n);
  }
  t.appendChild(renderList(roots, true));
}

let qSig = '';
async function sendAnswer(q, text, msg, btns){
  msg.textContent = '';
  if (!text.trim()) { msg.textContent = 'Write an answer first.'; return; }
  for (const b of btns) b.disabled = true;
  try {
    const r = await fetch('/app/briefs/' + runId + '/answer', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question_id: q.id, answer: text })
    });
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (r.ok) {
      msg.textContent = j.resumed ? 'Saved. Planning continues.' : ('Saved. ' + j.remaining + ' more to answer.');
      qSig = '';
      kick();
    } else {
      msg.textContent = j.error || ('Refused (' + r.status + ').');
    }
  } catch (e) {
    msg.textContent = 'Failed: ' + e.message;
  }
  for (const b of btns) b.disabled = false;
}

function renderWaves(ws, rp){
  const box = $('waves');
  box.textContent = '';
  if (!ws.length) box.appendChild(el('div', 'meta', 'No waves yet.'));
  else {
    const t = el('table');
    const hr = el('tr');
    for (const c of ['wave', 'check', 'leaves verified', 'failing leaves']) hr.appendChild(el('th', '', c));
    t.appendChild(hr);
    for (const w of ws) {
      const tr = el('tr');
      tr.appendChild(el('td', '', w.wave));
      const c = el('td'); c.appendChild(pill(w.check, w.check === 'repairing' ? 'running' : w.check)); tr.appendChild(c);
      tr.appendChild(el('td', '', w.verified + '/' + w.leaves.length));
      tr.appendChild(el('td', '', w.failing_leaves.join(', ')));
      t.appendChild(tr);
    }
    box.appendChild(t);
  }
  const rb = $('repairs');
  rb.textContent = '';
  rb.appendChild(el('div', 'meta', 'Reopened after a failed wave check, whole run: ' + rp.total + (rp.total ? '' : ' (counted when the run ends)')));
  if (rp.open.length) {
    const t = el('table');
    const hr = el('tr');
    for (const c of ['leaf', 'wave', 'attempts so far', 'reason', 'status']) hr.appendChild(el('th', '', c));
    t.appendChild(hr);
    for (const r of rp.open) {
      const tr = el('tr');
      tr.appendChild(el('td', '', r.leaf));
      tr.appendChild(el('td', '', r.wave));
      tr.appendChild(el('td', '', r.attempts));
      tr.appendChild(el('td', '', r.reason));
      tr.appendChild(el('td', '', r.status));
      t.appendChild(tr);
    }
    rb.appendChild(t);
  }
}

function renderQuestions(qs){
  // Rebuilding the boxes on every update would wipe what is being typed, so
  // they are only rebuilt when the questions themselves changed.
  const sig = JSON.stringify(qs);
  if (sig === qSig) return;
  qSig = sig;
  const box = $('questions');
  box.textContent = '';
  if (!qs.length) { box.appendChild(el('div', 'meta', 'None.')); return; }
  for (const q of qs) {
    const d = el('div', 'q');
    d.appendChild(el('div', '', q.id + ' (' + q.kind + ', round ' + q.round + '): ' + q.question));
    if (q.status === 'settled') {
      d.appendChild(el('div', 'meta', 'Answer: ' + q.answer + '  [answered by ' + (q.answered_by || 'unknown') + ']'));
    } else {
      d.appendChild(el('div', 'meta', q.askable ? 'Waiting for your answer' : 'Open'));
      if (q.why) d.appendChild(el('div', 'meta', 'Why it matters: ' + q.why));
      if (q.options && q.options.length) d.appendChild(el('div', 'meta', 'Options: ' + q.options.join(' | ')));
      if (q.askable) {
        const ta = el('textarea');
        ta.rows = 2; ta.maxLength = 8192; ta.setAttribute('aria-label', 'Answer to ' + q.id);
        const msg = el('span', 'err');
        const send = el('button', '', 'Send answer');
        send.type = 'button';
        const btns = [send];
        if (q.recommended) {
          const rec = el('button', '', 'Use recommended: ' + q.recommended);
          rec.type = 'button';
          rec.title = q.recommended_why || '';
          rec.addEventListener('click', () => sendAnswer(q, q.recommended, msg, btns));
          btns.push(rec);
          d.appendChild(el('div', 'meta', 'Recommended: ' + q.recommended + (q.recommended_why ? ' (' + q.recommended_why + ')' : '')));
        }
        send.addEventListener('click', () => sendAnswer(q, ta.value, msg, btns));
        d.appendChild(ta);
        d.appendChild(el('br'));
        for (const b of btns) { d.appendChild(b); d.appendChild(document.createTextNode(' ')); }
        d.appendChild(msg);
      }
    }
    box.appendChild(d);
  }
}

function renderAcceptance(a){
  const box = $('accept');
  box.textContent = '';
  if (!a) { box.appendChild(el('div', 'meta', 'Not run yet.')); return; }
  box.appendChild(el('div', 'meta', 'Acceptance ' + a.acceptance.passed + ' of ' + a.acceptance.total +
    '; constraints ' + a.constraints.passed + ' of ' + a.constraints.total + '; repair round ' + a.round +
    (a.complete ? '' : '; in progress') + (a.reason ? ' (' + a.reason + ')' : '')));
  const t = el('table');
  for (const b of a.bullets) {
    const tr = el('tr');
    tr.appendChild(el('td', '', b.requirement));
    tr.appendChild(el('td', '', b.kind));
    const v = el('td'); v.appendChild(pill(b.verdict)); tr.appendChild(v);
    tr.appendChild(el('td', '', b.text));
    t.appendChild(tr);
  }
  box.appendChild(t);
}

let timer = null;
let es = null;
// kick refetches soon (after an answer). With a live stream the stream
// delivers the change; the fetch only runs when polling.
function kick(){ if (es) return; clearTimeout(timer); timer = setTimeout(refresh, 300); }

// show puts one state on the page and says whether the run can still change.
function show(s){
  $('load').textContent = '';
  renderHead(s.run);
  renderProblems(s);
  renderTree(s.nodes);
  renderProgress(s.progress);
  renderTiming(s.stages || [], s.slow_calls || []);
  renderWaves(s.wave_checks || [], s.repairs || { total: 0, open: [] });
  renderQuestions(s.questions);
  renderAcceptance(s.acceptance);
  $('understanding').textContent = s.understanding || '(none yet)';
  const log = $('log');
  const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.textContent = s.log_tail.join('\n');
  if (atEnd) log.scrollTop = log.scrollHeight;
  const ph = s.run.phase;
  return s.run.active || !(ph === 'done' || ph === 'failed' || ph === 'stopped' || ph === 'interrupted');
}

// refresh is the polling fallback: one fetch every 3 s while the run is live.
async function refresh(){
  clearTimeout(timer);
  let again = true;
  try {
    const r = await fetch('/app/briefs/' + runId + '/state', { credentials: 'same-origin', cache: 'no-store' });
    if (r.status === 404) { $('load').textContent = 'No such run.'; return; }
    if (!r.ok) throw new Error(String(r.status));
    again = show(await r.json());
  } catch (e) {
    $('load').textContent = 'Could not refresh: ' + e.message;
  }
  if (again) timer = setTimeout(refresh, 3000);
}

// live follows the run over a server-sent event stream and drops to polling
// if the stream cannot be had.
function live(){
  if (typeof EventSource === 'undefined') { refresh(); return; }
  es = new EventSource('/app/briefs/' + runId + '/events');
  es.addEventListener('state', ev => {
    try { show(JSON.parse(ev.data)); } catch (e) { $('load').textContent = 'Bad update: ' + e.message; }
  });
  es.addEventListener('end', () => { es.close(); });
  es.onerror = () => {
    // An error is also the end of a finished stream; either way, one fetch
    // shows the truth and keeps polling only while the run is live.
    es.close();
    es = null;
    refresh();
  };
}

$('stop').addEventListener('click', async () => {
  $('stop').disabled = true;
  $('stopmsg').textContent = '';
  try {
    const r = await fetch('/app/briefs/' + runId + '/stop', { method: 'POST', credentials: 'same-origin' });
    if (!r.ok) $('stopmsg').textContent = 'Stop refused (' + r.status + ').';
  } catch (e) {
    $('stopmsg').textContent = 'Stop failed: ' + e.message;
  }
  $('stop').disabled = false;
});

$('resubmit').addEventListener('click', async () => {
  $('resubmit').disabled = true;
  $('stopmsg').textContent = '';
  try {
    const r = await fetch('/app/briefs/' + runId + '/resubmit', { method: 'POST', credentials: 'same-origin' });
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (r.status === 202 && j.url) { window.location.assign(j.url); return; }
    $('stopmsg').textContent = (j.error || 'Resubmit refused (' + r.status + ')') + (j.active_run_id ? ': ' + j.active_run_id : '') + '.';
  } catch (e) {
    $('stopmsg').textContent = 'Resubmit failed: ' + e.message;
  }
  $('resubmit').disabled = false;
});

if (!runId) { $('load').textContent = 'Bad run id.'; } else { live(); }
</script>
</body>
</html>
