name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # desktop/main.go embeds frontend/dist, which is a build artifact and is
      # gitignored, so it does not exist in a fresh checkout. Without this the
      # very first Go step fails with:
      #
      #   desktop/main.go:16:12: pattern all:frontend/dist: no matching files found
      #
      # It has to run before vet and build, not just before the tests, because
      # both compile the package. Building here also means CI type-checks the
      # frontend at all: "npm run build" is "tsc && vite build", and nothing
      # else in this pipeline looks at the TypeScript.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Build desktop frontend (produces the embedded assets)
        run: |
          cd desktop/frontend
          npm ci
          npm run build

      - name: gofmt (check formatting)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: bubblecomplete module (build/vet/test)
        run: cd bubblecomplete && go build ./... && go vet ./... && go test ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
