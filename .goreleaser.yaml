# GoReleaser config for gophermind — signed + notarized macOS binary,
# distributed via a Homebrew cask. Run releases locally on a Mac (see
# docs/RELEASING.md). Validate with `goreleaser check`.
version: 2
project_name: gophermind

before:
  hooks:
    - go mod tidy

builds:
  - id: gophermind
    main: ./cmd/gophermind
    binary: gophermind
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Reproducible builds: strip local paths so the output is path-independent
    # (combined with mod_timestamp + pinned deps this yields deterministic binaries).
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X gophermind/internal/version.Version={{ .Version }}
      - -X gophermind/internal/version.Commit={{ .ShortCommit }}
      - -X gophermind/internal/version.Date={{ .CommitDate }}

# Merge the two arches into one universal binary, then code-sign it with a
# Developer ID Application identity (hardened runtime + secure timestamp). The
# identity is read from the environment so it never lives in this public repo.
universal_binaries:
  - id: gophermind
    replace: true
    hooks:
      # codesign.sh reads $MACOS_SIGN_IDENTITY itself and no-ops when it is unset,
      # so a credential-free `--snapshot` build still succeeds (this hook is NOT
      # covered by --skip=sign).
      post:
        - ./scripts/codesign.sh "{{ .Path }}"
        # Notarize HERE, before the archive is built and published. Doing it
        # after `goreleaser release` (as the Makefile used to) publishes an
        # un-notarized tarball first, and macOS caches that verdict.
        - ./scripts/notarize-binary.sh "{{ .Path }}"

archives:
  - id: gophermind
    ids: [gophermind]
    # Predictable names the npm postinstall downloader relies on. The macOS
    # universal binary is "<name>_<version>_darwin_all.tar.gz".
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

# Linux native packages (deb/rpm/apk) via nfpm — `native installs everywhere`.
nfpms:
  - id: gophermind
    ids: [gophermind]
    package_name: gophermind
    vendor: jbrahy
    homepage: "https://github.com/jbrahy/gophermind.com"
    maintainer: "John Brahy"
    description: "A minimal agentic coding harness for OpenAI-compatible LLMs"
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin

# Windows Scoop and winget publishing are DISABLED because their target
# repositories do not exist: jbrahy/scoop-bucket and jbrahy/winget-pkgs both
# return 404. GoReleaser treats that as a fatal publish error, so every release
# failed at the very last step with the GitHub release and Homebrew tap already
# updated. That is a confusing half-success, and it also meant any later step
# in `make release` never ran.
#
# To re-enable: create a `scoop-bucket` repository, fork microsoft/winget-pkgs
# as `winget-pkgs`, then uncomment the block below. Nothing else needs to
# change; the configuration is known-good apart from the missing repos.
#
# scoops:
#   - name: gophermind
#     ids: [gophermind]
#     repository:
#       owner: jbrahy
#       name: scoop-bucket
#     homepage: "https://github.com/jbrahy/gophermind.com"
#     description: "A minimal agentic coding harness for OpenAI-compatible LLMs"
#     license: MIT
#
# winget:
#   - name: gophermind
#     ids: [gophermind]
#     publisher: jbrahy
#     short_description: "A minimal agentic coding harness for OpenAI-compatible LLMs"
#     license: MIT
#     homepage: "https://github.com/jbrahy/gophermind.com"
#     repository:
#       owner: jbrahy
#       name: winget-pkgs
#       branch: "gophermind-{{ .Version }}"

checksum:
  name_template: checksums.txt

# Software Bill of Materials (SBOM) per archive via syft — a verifiable supply
# chain. Published alongside the release artifacts.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

# Notarization is NOT done through GoReleaser's `signs` (which always registers
# a .sig artifact, and does not fit an in-place notarize). It happens in the
# universal_binaries hooks above, right after codesigning and BEFORE the archive
# is built, so nothing un-notarized is ever uploaded. It used to run after
# `goreleaser release` had already published, which shipped an un-notarized
# tarball first; macOS caches that verdict, so fixing it afterward did not help
# anyone who had already downloaded. The archive's
# binary is byte-identical, so Apple's hash registration still validates it.

homebrew_casks:
  - name: gophermind
    ids: [gophermind]
    binaries:
      - gophermind
    repository:
      owner: jbrahy
      name: homebrew-tap
    homepage: "https://github.com/jbrahy/gophermind.com"
    description: "A minimal agentic coding harness for OpenAI-compatible LLMs"
    license: MIT
    # Belt-and-suspenders: strip the quarantine xattr on install. The binary is
    # already signed + notarized, so this just guarantees no first-run prompt.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gophermind"]
          end

release:
  github:
    owner: jbrahy
    name: gophermind.com

  # The desktop app rides along on the same release. GoReleaser cannot build
  # it - it produces Go binaries, and a Wails app is a .app bundle with an
  # Info.plist, an icon and a compiled frontend inside - so scripts/build-desktop.sh
  # builds, signs, notarizes and STAPLES it, and the result is attached here.
  #
  # Staged in dist-desktop/, deliberately not dist/: `goreleaser release
  # --clean` removes dist/ as its first action, so an artifact built there
  # beforehand would be deleted before it could be attached.
  # Note that `goreleaser release --snapshot` skips publishing entirely and so
  # never evaluates these globs: a green snapshot is not evidence the desktop
  # artifact was produced. Check dist/ for it, which is what
  # `make desktop-release` does before handing over.
  # Pinned to {{ .Version }} rather than a wildcard. A wildcard attached every
  # desktop zip left in the staging directory, so the v0.7.1 release shipped
  # with the 0.7.0 app alongside it: two apps, no indication which was current.
  # The script also clears the directory now, but that only removes the cause;
  # this removes the possibility.
  extra_files:
    - glob: ./dist-desktop/GopherMind-Desktop_{{ .Version }}_darwin_universal.zip
    - glob: ./dist-desktop/GopherMind-Desktop_{{ .Version }}_darwin_universal.zip.sha256
