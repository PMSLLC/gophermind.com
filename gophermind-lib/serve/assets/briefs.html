<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'none'">
<title>Runs - GopherMind</title>
<style>
/*GM_CSS*/
</style>
</head>
<body class="gm-briefs">
<div class="shell">
<!--GM_RAIL-->
<main class="main">
<div class="head"><h1>Runs</h1><div class="actions"><a class="btn primary" href="/app/briefs/new">Upload brief</a></div></div>
<div id="empty"></div>
<div class="tablewrap" id="wrap" hidden>
<table id="tbl">
  <thead><tr><th>Run</th><th>Title</th><th>Launch</th><th>State</th><th>Started</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
</main>
</div>
<script>
'use strict';
function pill(text){
  const s = document.createElement('span');
  s.className = 'pill';
  s.textContent = text || '-';
  if (['planning','running','building','waiting'].includes(text)) s.className += ' live';
  if (['done','verified'].includes(text)) s.className += ' good';
  if (['failed','stopped','interrupted','escalated','harness_fault'].includes(text)) s.className += ' bad';
  return s;
}
function cell(tr, child){
  const td = document.createElement('td');
  td.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  tr.appendChild(td);
}
function when(iso){
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
fetch('/app/api/briefs', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
  .then(j => {
    const rows = document.getElementById('rows');
    if (!j.runs.length) { document.getElementById('empty').textContent = 'No runs yet. Upload a brief to start one.'; return; }
    document.getElementById('wrap').hidden = false;
    for (const r of j.runs) {
      const tr = document.createElement('tr');
      const a = document.createElement('a');
      a.href = '/app/briefs/' + encodeURIComponent(r.id);
      a.textContent = r.id;
      cell(tr, a);
      cell(tr, r.title || '');
      cell(tr, pill(r.phase));
      cell(tr, pill(r.status));
      cell(tr, when(r.started_at));
      rows.appendChild(tr);
    }
  })
  .catch(e => { document.getElementById('empty').textContent = 'Could not load runs: ' + e.message; });
</script>
</body>
</html>
