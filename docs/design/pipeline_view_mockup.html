<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Runner — Live Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0D1210;
    --panel:#131A17;
    --panel-2:#0F1512;
    --line:#243029;
    --ink:#E7ECE9;
    --muted:#7C8C85;
    --dim:#4B5A54;
    --phosphor:#6FDE8C;
    --amber:#E8A33D;
    --rust:#E2604B;
    --teal:#4FB8B0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--void);}
  body{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding:20px;
    gap:16px;
  }

  /* ---- header ---- */
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .masthead{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.2px;
  }
  .masthead span{color:var(--muted); font-weight:500; font-size:14px; margin-left:10px; font-family:'IBM Plex Mono', monospace;}
  .runmeta{
    display:flex;
    gap:22px;
    font-size:12.5px;
    color:var(--muted);
  }
  .runmeta b{color:var(--ink); font-weight:600;}

  /* ---- layout ---- */
  .board{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:16px;
    flex:1;
    min-height:0;
  }
  @media (max-width:820px){
    .board{grid-template-columns:1fr;}
  }

  /* ---- wave column ---- */
  .waves{
    display:flex;
    flex-direction:column;
    gap:14px;
    overflow-y:auto;
    padding-right:4px;
  }
  .wave-label{
    font-size:11px;
    color:var(--dim);
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .wave-label .rule{flex:1; height:1px; background:var(--line);}
  .wave-block{margin-bottom:4px;}

  .task-pill{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px 10px;
    border:1px solid var(--line);
    background:var(--panel);
    margin-bottom:6px;
    cursor:pointer;
    font-size:12.5px;
    transition:border-color 120ms ease, background 120ms ease;
  }
  .task-pill:hover{border-color:var(--dim);}
  .task-pill.active{
    border-color:var(--teal);
    background:#122320;
  }
  .dot{
    width:8px; height:8px; flex:0 0 8px;
    border-radius:50%;
    background:var(--dim);
  }
  .dot.queued{background:var(--dim);}
  .dot.running{background:var(--amber); box-shadow:0 0 0 3px rgba(232,163,61,0.15); animation:pulse 1.4s ease-in-out infinite;}
  .dot.verified{background:var(--phosphor);}
  .dot.revisit{background:var(--rust); box-shadow:0 0 0 3px rgba(226,96,75,0.18); animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.45;}
  }
  .task-pill .tname{flex:1; color:var(--ink);}
  .task-pill .tstatus{color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px;}

  /* ---- hero / detail panel ---- */
  .detail{
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
  }
  .detail-head{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    background:var(--panel-2);
  }
  .detail-head .tag{
    font-size:10.5px;
    color:var(--dim);
    letter-spacing:0.5px;
    margin-bottom:6px;
  }
  .detail-head h2{
    margin:0 0 10px 0;
    font-size:17px;
    font-weight:600;
    font-family:'IBM Plex Mono', monospace;
  }
  .spec-row{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    font-size:12px;
  }
  .spec-row div{max-width:420px;}
  .spec-row .k{color:var(--dim); font-size:10.5px; letter-spacing:0.4px; margin-bottom:3px;}
  .spec-row .v{color:var(--muted); line-height:1.5;}

  .log{
    flex:1;
    overflow-y:auto;
    padding:14px 18px;
    font-size:12.5px;
    line-height:1.6;
  }
  .log-line{
    display:grid;
    grid-template-columns:20px 190px 1fr 70px;
    gap:12px;
    align-items:baseline;
    padding:6px 0;
    border-bottom:1px solid var(--panel-2);
    opacity:0;
    animation:rise 260ms ease forwards;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:translateY(0);}
  }
  .log-line .idx{color:var(--dim);}
  .log-line .model{color:var(--ink);}
  .log-line .reason{color:var(--muted);}
  .log-line .verdict{text-align:right; font-weight:600; letter-spacing:0.3px;}
  .verdict.running{color:var(--amber);}
  .verdict.pass{color:var(--phosphor);}
  .verdict.fail{color:var(--rust);}

  .revisit-block{
    margin-top:10px;
    border:1px dashed var(--rust);
    background:#1A100E;
    padding:12px 14px;
    font-size:12px;
    color:#F0B7AC;
    opacity:0;
    animation:rise 300ms ease forwards;
  }
  .revisit-block .k{color:var(--rust); font-size:10.5px; letter-spacing:0.4px; margin-bottom:5px; font-weight:600;}

  .foot{
    border-top:1px solid var(--line);
    padding:10px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--panel-2);
  }
  .replay{
    background:none;
    border:1px solid var(--dim);
    color:var(--muted);
    font-family:inherit;
    font-size:11.5px;
    padding:6px 12px;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  .replay:hover{border-color:var(--teal); color:var(--teal);}
  .foot .hint{font-size:11px; color:var(--dim);}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="masthead">TASK RUNNER<span>/ live pipeline</span></div>
    <div class="runmeta">
      <div>RUN <b>#0417</b></div>
      <div>WAVE <b id="waveIndicator">2 / 3</b></div>
      <div>ELAPSED <b id="elapsed">00:00</b></div>
    </div>
  </header>

  <div class="board">
    <div class="waves" id="waves"></div>
    <div class="detail">
      <div class="detail-head">
        <div class="tag" id="detailTag">WAVE 2 · IMPLEMENTATION</div>
        <h2 id="detailTitle">—</h2>
        <div class="spec-row">
          <div>
            <div class="k">DELIVERABLE</div>
            <div class="v" id="detailDeliverable">—</div>
          </div>
          <div>
            <div class="k">TEST</div>
            <div class="v" id="detailTest">—</div>
          </div>
        </div>
      </div>
      <div class="log" id="log"></div>
      <div class="foot">
        <div class="hint">click a task on the left to inspect its attempt log</div>
        <button class="replay" id="replayBtn">↻ replay</button>
      </div>
    </div>
  </div>
</div>

<script>
const tasks = [
  {
    id:'contract', wave:1, name:'Define OpenAPI schema for billing service',
    deliverable:'Contract v1.2 — endpoints, request/response shapes, error codes',
    test:'schema lints clean + reviewed against product brief',
    status:'verified',
    attempts:[
      {model:'Claude 3.7 Sonnet — planner', duration:'8.9s', verdict:'pass', reason:'contract published as Wave 2/3 reference'}
    ]
  },
  {
    id:'subs-endpoint', wave:2, name:'Implement POST /subscriptions endpoint',
    deliverable:'New endpoint per contract §3.4, returns 201 with subscription object',
    test:'tests/subscriptions_create.spec — 6 cases must pass',
    status:'verified', auto:true,
    attempts:[
      {model:'Mixtral-8x7B — free (Together)', duration:'6.1s', verdict:'fail', reason:'3/6 failing — no idempotency key handling'},
      {model:'Gemini 1.5 Flash — free tier', duration:'4.8s', verdict:'fail', reason:'2/6 failing — wrong status on duplicate plan'},
      {model:'Llama-3.3-70B — free (Groq)', duration:'5.3s', verdict:'pass', reason:'6/6 passing'}
    ]
  },
  {
    id:'webhook', wave:2, name:'Implement Stripe webhook handler',
    deliverable:'Handler for invoice.paid / invoice.payment_failed per contract §4.1',
    test:'tests/webhooks.spec — 5 cases must pass',
    status:'queued',
    attempts:[]
  },
  {
    id:'proration', wave:2, name:'Implement usage-based proration calculator',
    deliverable:'Prorated charge for mid-cycle plan changes per contract §5.1',
    test:'tests/proration.spec — 9 cases incl. leap-year and timezone edges',
    status:'revisit',
    attempts:[
      {model:'Mixtral-8x7B — free (Together)', duration:'5.7s', verdict:'fail', reason:'7/9 — rounding drift on partial-day charges'},
      {model:'Gemini 1.5 Flash — free tier', duration:'4.2s', verdict:'fail', reason:'6/9 — timezone offset applied twice'},
      {model:'Llama-3.3-70B — free (Groq)', duration:'6.6s', verdict:'fail', reason:'8/9 — leap-year Feb 29 case still off by one day'}
    ],
    revisitNote:'All 3 models converge on the same 1-2 edge cases (leap year, tz offset). Test suite may be stricter than the deliverable specifies. Flagged for planner review before a 4th attempt.'
  },
  {id:'gateway', wave:3, name:'Wire billing service into API gateway', deliverable:'Route registration + auth middleware per contract §2', test:'gateway integration smoke test', status:'queued', attempts:[]},
  {id:'inttest', wave:3, name:'Write integration test suite for billing flow', deliverable:'End-to-end suite covering create → invoice → webhook', test:'suite runs green against staging', status:'queued', attempts:[]},
  {id:'loadtest', wave:3, name:'Load test subscription endpoint at 500 rps', deliverable:'Latency + error-rate report at target load', test:'p99 < 400ms, error rate < 0.1%', status:'queued', attempts:[]},
];

const wavesEl = document.getElementById('waves');
const logEl = document.getElementById('log');
const titleEl = document.getElementById('detailTitle');
const tagEl = document.getElementById('detailTag');
const delivEl = document.getElementById('detailDeliverable');
const testEl = document.getElementById('detailTest');
const replayBtn = document.getElementById('replayBtn');
const waveIndicator = document.getElementById('waveIndicator');
const elapsedEl = document.getElementById('elapsed');

let timers = [];
function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers = []; }

function renderWaves(){
  wavesEl.innerHTML = '';
  const byWave = {};
  tasks.forEach(t => { (byWave[t.wave] = byWave[t.wave] || []).push(t); });
  Object.keys(byWave).sort().forEach(w => {
    const block = document.createElement('div');
    block.className = 'wave-block';
    const label = document.createElement('div');
    label.className = 'wave-label';
    label.innerHTML = `WAVE ${w}<div class="rule"></div>`;
    block.appendChild(label);
    byWave[w].forEach(t => {
      const pill = document.createElement('div');
      pill.className = 'task-pill' + (t.id === current ? ' active' : '');
      pill.dataset.id = t.id;
      pill.innerHTML = `<div class="dot ${t.status}"></div><div class="tname">${t.name}</div><div class="tstatus">${t.status}</div>`;
      pill.addEventListener('click', () => loadTask(t.id));
      block.appendChild(pill);
    });
    wavesEl.appendChild(block);
  });
}

let current = 'subs-endpoint';

function loadTask(id){
  current = id;
  clearTimers();
  const t = tasks.find(x => x.id === id);
  tagEl.textContent = `WAVE ${t.wave} · ${t.wave===1?'CONTRACT':t.wave===2?'IMPLEMENTATION':'INTEGRATION'}`;
  titleEl.textContent = t.name;
  delivEl.textContent = t.deliverable;
  testEl.textContent = t.test;
  logEl.innerHTML = '';
  renderWaves();
  playAttempts(t);
}

function playAttempts(t){
  if(!t.attempts.length){
    logEl.innerHTML = `<div class="log-line" style="grid-template-columns:1fr; animation-delay:0ms;"><div class="reason">Queued — waiting on upstream wave to complete.</div></div>`;
    return;
  }
  t.attempts.forEach((a, i) => {
    const runTimer = setTimeout(() => {
      const line = document.createElement('div');
      line.className = 'log-line';
      line.style.animationDelay = '0ms';
      line.innerHTML = `<div class="idx">${String(i+1).padStart(2,'0')}</div><div class="model">${a.model}</div><div class="reason">attempting…</div><div class="verdict running">RUNNING</div>`;
      line.id = 'line-' + i;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;

      const resolveTimer = setTimeout(() => {
        const el = document.getElementById('line-' + i);
        if(!el) return;
        el.querySelector('.reason').textContent = a.reason;
        const v = el.querySelector('.verdict');
        v.textContent = a.verdict === 'pass' ? 'PASSED' : 'FAILED';
        v.className = 'verdict ' + a.verdict;

        if(i === t.attempts.length - 1 && t.status === 'revisit'){
          const rTimer = setTimeout(() => {
            const block = document.createElement('div');
            block.className = 'revisit-block';
            block.innerHTML = `<div class="k">↳ SENT BACK TO PLANNER — TASK DEFINITION UNDER REVISION</div>${t.revisitNote}`;
            logEl.appendChild(block);
            logEl.scrollTop = logEl.scrollHeight;
          }, 500);
          timers.push(rTimer);
        }
      }, 900);
      timers.push(resolveTimer);
    }, i * 1500);
    timers.push(runTimer);
  });
}

replayBtn.addEventListener('click', () => loadTask(current));

// elapsed timer
let seconds = 187;
setInterval(() => {
  seconds++;
  const m = String(Math.floor(seconds/60)).padStart(2,'0');
  const s = String(seconds%60).padStart(2,'0');
  elapsedEl.textContent = `${m}:${s}`;
}, 1000);

renderWaves();
loadTask(current);
</script>
</body>
</html>
