<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'none'">
<title>GopherMind</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;color:#1d2330}
  nav{display:flex;gap:12px;margin:1.5rem 0}
  nav a{padding:10px 18px;border:1px solid #9aa4b5;border-radius:6px;text-decoration:none;color:inherit}
  nav a:hover{border-color:#0b7a75;color:#0b7a75}
  .who{color:#556;font-size:.9rem}
  button{font:inherit;padding:6px 14px;border:1px solid #9aa4b5;border-radius:6px;background:none;cursor:pointer}
</style>
</head>
<body class="gm-home">
<h1>GopherMind</h1>
<p class="who">Signed in as <b id="email">...</b></p>
<nav>
  <a href="/app/chat">Chat</a>
  <a href="/app/briefs/new">Upload brief</a>
  <a href="/app/briefs">Runs</a>
  <a href="/pipeline">Pipeline</a>
</nav>
<form method="post" action="/auth/logout"><button type="submit">Sign out</button></form>
<script>
fetch('/auth/me', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
  .then(j => { document.getElementById('email').textContent = j.email; })
  .catch(() => { document.getElementById('email').textContent = 'unknown'; });
</script>
</body>
</html>
